name: ROUTIVE policy domain JVM tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/com/move60/workout/domain/**'
      - 'app/src/test/java/com/move60/workout/domain/**'
      - 'app/src/main/java/com/move60/workout/architecture/**'
      - 'app/src/test/java/com/move60/workout/architecture/**'
      - 'app/schemas/**'
      - 'app/build.gradle'
      - '.github/workflows/routive-domain-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  domain-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and run ROUTIVE policy domain JVM tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Generate Room schemas into a clean directory
        # Also when the tests failed: a missing schema export is exactly what a new Room version needs this artifact for.
        if: always()
        run: gradle --no-daemon :app:kspDebugKotlin -ProomSchemaOut=${{ runner.temp }}/room-schemas-fresh
      - name: Upload the freshly generated Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: ${{ runner.temp }}/room-schemas-fresh
          if-no-files-found: warn

