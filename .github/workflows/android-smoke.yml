name: MOVE60 Android runtime smoke test
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: ['feature/workout-history-vnext']
    paths:
      - 'app/src/**'
      - 'app/build.gradle'
      - 'scripts/smoke-android.sh'
      - '.github/workflows/android-smoke.yml'
# Superseded PR commits must not keep running expensive emulators in parallel.
# Main release remains controlled by the separate release workflow.
concurrency:
  group: move60-pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify release dependency policy
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 scripts/verify-release-gates.py
      - name: Verify unified phone and Wear OS design tokens
        run: python3 scripts/verify-design-tokens.py
      - name: Verify Compose, Hilt, Room and WorkManager architecture
        run: python3 scripts/verify-compose-architecture.py
      - name: Verify v36 mobile clean-up and Watch4 health privacy
        run: python3 scripts/verify-v36-ui.py
      - name: Verify weekday durations and cycling intervals
        run: node scripts/verify-plan.cjs
      - name: Pre-merge release lint and phone / Watch4 debug builds
        run: gradle --no-daemon :app:lintVitalRelease :wear:lintVitalRelease :app:assembleDebug :wear:assembleDebug :app:assembleDebugAndroidTest :wear:assembleDebugAndroidTest
      - name: Enable KVM access for emulator
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Launch Android emulator and run startup / workout checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 4096 -cores 2
          disable-animations: true
          script: |
            bash scripts/smoke-android.sh
            # Required phone instrumentation now runs in the same clean phone-only emulator.
            bash scripts/smoke-phone-features.sh
      - name: Upload emulator notification screenshot and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: move60-smoke-evidence
          path: smoke-debug/
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload AndroidRuntime logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: move60-smoke-logs
          path: smoke-debug/
          if-no-files-found: ignore


  # Run the same round-screen instrumentation before merge, rather than first discovering
  # Watch4 regressions during the main-branch release.
  premerge-wear-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Watch4 APK and instrumentation
        run: gradle --no-daemon :wear:assembleDebug :wear:assembleDebugAndroidTest
      - name: Enable KVM access for Wear OS emulator
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Run small-round Wear OS layout and interaction checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: android-wear
          profile: wearos_small_round
          avd-name: move60_wear_pr_gate
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 3072
          disable-animations: true
          script: bash scripts/smoke-watch-layout.sh
      - name: Upload Wear OS pre-merge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: move60-pr-wear-evidence
          path: smoke-debug/
          if-no-files-found: ignore
          retention-days: 7
