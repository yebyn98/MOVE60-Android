name: MOVE60 Android runtime smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/src/**'
      - 'app/build.gradle'
      - 'scripts/smoke-android.sh'
      - '.github/workflows/android-smoke.yml'
permissions:
  contents: read
jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Kotlin debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM access for emulator
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Launch Android emulator and run startup / workout checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/smoke-android.sh
      - name: Upload emulator notification screenshot and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: move60-smoke-evidence
          path: smoke-debug/
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload AndroidRuntime logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: move60-smoke-logs
          path: smoke-debug/
          if-no-files-found: ignore
