name: Build MOVE60 Kotlin Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER" || { echo "sdkmanager missing"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate original 60-minute weekday routines
        run: node scripts/verify-plan.cjs
      - name: Check there is no old WebView or Java source
        shell: bash
        run: |
          test -z "$(find app/src/main -name '*.java' -o -name '*.html' -print -quit)" || { echo "Legacy Java/HTML UI remains"; exit 1; }
          grep -q "class MainActivity" app/src/main/java/com/move60/workout/MainActivity.kt
          grep -q "class WorkoutService" app/src/main/java/com/move60/workout/WorkoutService.kt
      - name: Build Kotlin native APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOVE60-Kotlin-v8-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
