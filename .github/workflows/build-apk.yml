name: Build MOVE60 Kotlin Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER" || { echo "sdkmanager missing"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate original 60-minute weekday routines
        run: node scripts/verify-plan.cjs
      - name: Check there is no old WebView or Java source
        shell: bash
        run: |
          test -z "$(find app/src/main -name '*.java' -o -name '*.html' -print -quit)" || { echo "Legacy Java/HTML UI remains"; exit 1; }
          grep -q "class MainActivity" app/src/main/java/com/move60/workout/MainActivity.kt
          grep -q "class WorkoutService" app/src/main/java/com/move60/workout/WorkoutService.kt
      - name: Restore fixed signing key from GitHub Secret
        env:
          MOVE60_SIGNING_BUNDLE_BASE64: ${{ secrets.MOVE60_SIGNING_BUNDLE_BASE64 }}
        shell: bash
        run: |
          if [ -n "$MOVE60_SIGNING_BUNDLE_BASE64" ]; then
            printf '%s' "$MOVE60_SIGNING_BUNDLE_BASE64" | base64 -d > "$RUNNER_TEMP/move60-signing.zip"
            mkdir -p "$RUNNER_TEMP/move60-signing"
            unzip -q "$RUNNER_TEMP/move60-signing.zip" -d "$RUNNER_TEMP/move60-signing"
            test -f "$RUNNER_TEMP/move60-signing/move60.p12"
            set -a
            source "$RUNNER_TEMP/move60-signing/signing.env"
            set +a
            echo "MOVE60_KEYSTORE_PATH=$RUNNER_TEMP/move60-signing/move60.p12" >> "$GITHUB_ENV"
            echo "MOVE60_STORE_PASSWORD=$MOVE60_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "MOVE60_KEY_PASSWORD=$MOVE60_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "MOVE60_KEY_ALIAS=$MOVE60_KEY_ALIAS" >> "$GITHUB_ENV"
            echo 'MOVE60_SIGNED=true' >> "$GITHUB_ENV"
          else
            echo 'MOVE60_SIGNED=false' >> "$GITHUB_ENV"
            echo 'No stable signing secret: build test APK only.'
          fi
      - name: Build Kotlin native APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Build stable signed release APK
        if: env.MOVE60_SIGNED == 'true'
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Upload stable signed release APK
        if: env.MOVE60_SIGNED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MOVE60-stable-signed-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOVE60-Kotlin-v8-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
