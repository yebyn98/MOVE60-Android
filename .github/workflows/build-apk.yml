name: Build MOVE60 Kotlin Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: move60-release-main
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER" || { echo "sdkmanager missing"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate weekday workouts
        run: node scripts/verify-plan.cjs
      - name: Check native Kotlin-only sources
        shell: bash
        run: |
          test -z "$(find app/src/main -type f \( -name '*.java' -o -name '*.html' \) -print -quit)" || { echo "Legacy Java/HTML files exist"; exit 1; }
          test -f app/src/main/java/com/move60/workout/UpdateManager.kt
      - name: Restore stable signing key from repository secret
        env:
          MOVE60_SIGNING_BUNDLE_BASE64: ${{ secrets.MOVE60_SIGNING_BUNDLE_BASE64 }}
        shell: bash
        run: |
          python3 scripts/restore-signing.py
          set -a
          source "$RUNNER_TEMP/move60-signing/signing.env"
          set +a
          echo "MOVE60_KEYSTORE_PATH=$RUNNER_TEMP/move60-signing/move60.p12" >> "$GITHUB_ENV"
          echo "MOVE60_STORE_PASSWORD=$MOVE60_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MOVE60_KEY_PASSWORD=$MOVE60_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "MOVE60_KEY_ALIAS=$MOVE60_KEY_ALIAS" >> "$GITHUB_ENV"
          echo 'MOVE60_SIGNED=true' >> "$GITHUB_ENV"
      - name: Build Kotlin debug APK for compilation verification
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload debug verification APK
        uses: actions/upload-artifact@v4
        with:
          name: MOVE60-Kotlin-debug-test-only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Build stable signed release APK
        if: env.MOVE60_SIGNED == 'true'
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Upload stable signed release APK
        if: env.MOVE60_SIGNED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MOVE60-signed-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish the signed APK to public update repository
        if: env.MOVE60_SIGNED == 'true'
        env:
          MOVE60_UPDATES_PAT: ${{ secrets.MOVE60_UPDATES_PAT }}
        shell: bash
        run: |
          # Guard against older runs publishing an APK after a newer commit.
          CURRENT_MAIN="$(git -C "$GITHUB_WORKSPACE" ls-remote origin refs/heads/main | cut -f1)"
          if [ "$CURRENT_MAIN" != "$GITHUB_SHA" ]; then
            echo "Skipping outdated build $GITHUB_SHA; main is $CURRENT_MAIN"
            exit 0
          fi
          if [ -z "$MOVE60_UPDATES_PAT" ]; then
            echo '::error::MOVE60_UPDATES_PAT is unavailable in MOVE60-Android Actions secrets.'
            exit 1
          fi
          git -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$MOVE60_UPDATES_PAT" | base64 -w0)" \
            clone --quiet https://github.com/yebyn98/MOVE60-Updates.git "$RUNNER_TEMP/move60-updates"
          cd "$RUNNER_TEMP/move60-updates"
          cp "$GITHUB_WORKSPACE/app/build/outputs/apk/release/app-release.apk" MOVE60-latest.apk
          export SHA256="$(sha256sum MOVE60-latest.apk | awk '{print $1}')"
          python3 - <<'PY'
          import json, os, re, pathlib
          content=pathlib.Path(os.environ['GITHUB_WORKSPACE']+'/app/build.gradle').read_text()
          code=int(re.search(r'versionCode\s+(\d+)',content).group(1))
          name=re.search(r'versionName\s+\'([^\']+)\'',content).group(1)
          meta={'versionCode':code,'versionName':name,
                'apkUrl':'https://raw.githubusercontent.com/yebyn98/MOVE60-Updates/main/MOVE60-latest.apk',
                'sha256':os.environ['SHA256']}
          pathlib.Path('latest.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'MOVE60 CI'
          git config user.email 'move60-ci@users.noreply.github.com'
          git add MOVE60-latest.apk latest.json
          if ! git diff --cached --quiet; then
            git commit -qm "Publish MOVE60 version $(python3 -c 'import json;print(json.load(open("latest.json"))["versionName"])')"
            git -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$MOVE60_UPDATES_PAT" | base64 -w0)" push -q origin HEAD:main
          fi
