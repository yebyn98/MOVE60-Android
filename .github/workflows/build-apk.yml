name: Build MOVE60 Kotlin Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: move60-release-main
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  runtime-smoke:
    uses: ./.github/workflows/android-smoke.yml
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER" || { echo "sdkmanager missing"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify release dependency policy
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 scripts/verify-release-gates.py
      - name: Verify unified phone and Wear OS design tokens
        run: python3 scripts/verify-design-tokens.py
      - name: Verify Compose, Hilt, Room and WorkManager architecture
        run: python3 scripts/verify-compose-architecture.py
      - name: Verify v36 mobile clean-up and Watch4 health privacy
        run: python3 scripts/verify-v36-ui.py
      - name: Validate weekday workouts
        run: node scripts/verify-plan.cjs
      - name: Validate phone-only and Watch4-only release isolation
        run: python3 scripts/test_publish_selected.py
      - name: Verify removed exercise photos stay removed
        shell: bash
        run: |
          test ! -e app/src/main/java/com/move60/workout/ExercisePhotos.kt
          ! grep -q 'ExercisePhotos.addTo' app/src/main/java/com/move60/workout/MainActivity.kt
          ! grep -q 'openVirtualMate' app/src/main/java/com/move60/workout/MainActivity.kt
      - name: Check native Kotlin-only sources
        shell: bash
        run: |
          test -z "$(find app/src/main -type f \( -name '*.java' -o -name '*.html' \) -print -quit)" || { echo "Legacy Java/HTML files exist"; exit 1; }
          test -f app/src/main/java/com/move60/workout/UpdateManager.kt
      - name: Validate timer and notification release invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          service = Path("app/src/main/java/com/move60/workout/WorkoutService.kt").read_text()
          ui = Path("app/src/main/java/com/move60/workout/MainActivity.kt").read_text()
          smoke = Path("scripts/smoke-android.sh").read_text()
          watch = Path("wear/src/main/java/com/move60/watch/WatchActivity.kt").read_text()
          watch_manifest = Path("wear/src/main/AndroidManifest.xml").read_text()
          watch_sensor = Path("wear/src/main/java/com/move60/watch/HeartRateService.kt").read_text()
          checks = {
              "manual stage transition": "Only an explicit" in service and "nextStage()" in ui,
              "foreground notification ID": "private const val ONGOING_ID = 601" in service,
              "background workout history": "accountActiveTime(" in service and "history_checkpoint_ms" in service,
              "checkpoint survives unexpected service death": 'if (!snapshot.optBoolean("running", false) || snapshot.optBoolean("finished", false)) {\n            prefs.edit().putLong("history_checkpoint_ms", 0L).apply()' in service,
              "timer shown before summary": ui.index("content.addView(makeTimerCard())") < ui.index("content.addView(summary)"),
              "smoke test starts workout": "Tapped " in smoke and "Could not locate and tap workout start button" in smoke,
              "smoke test checks notification": "id=601" in smoke and "notifications.txt" in smoke,
              "smoke test checks process relaunch": "Testing app relaunch with persisted active timer" in smoke,
              "smoke test checks fatal errors": "FATAL EXCEPTION" in smoke,
              "watch heart rate permission callback": "onRequestPermissionsResult(" in watch and "registerHeartRateIfPermitted()" in watch,
              "watch heart rate service cleanup": "sensorManager.unregisterListener(this)" in watch_sensor and "it.release()" in watch_sensor,
              "watch heart rate service manifest": 'android:foregroundServiceType="health"' in watch_manifest and "FOREGROUND_SERVICE_HEALTH" in watch_manifest,
              "watch ambient and ongoing workout display": "AmbientLifecycleObserver" in watch and "WorkoutDisplayService" in watch_manifest,
              "watch sensor samples preserve timestamps": "event.timestamp" in watch_sensor and "measuredAt" in watch_sensor,
              "phone heart rate box": 'contentDescription = "실시간 심박수"' in ui and 'heartRateValue.text' in ui,
              "watch tile manifest registration": "WorkoutTileService" in watch_manifest and "BIND_TILE_PROVIDER" in watch_manifest,
          }
          for name, ok in checks.items():
              print(("PASS" if ok else "FAIL") + ": " + name)
          if not all(checks.values()):
              raise SystemExit("Release invariant check failed")
          PY
      - name: Restore stable signing key from repository secret
        env:
          MOVE60_SIGNING_BUNDLE_BASE64: ${{ secrets.MOVE60_SIGNING_BUNDLE_BASE64 }}
        shell: bash
        run: |
          python3 scripts/restore-signing.py
          set -a
          source "$RUNNER_TEMP/move60-signing/signing.env"
          set +a
          echo "::add-mask::$MOVE60_STORE_PASSWORD"
          echo "::add-mask::$MOVE60_KEY_PASSWORD"
          echo "MOVE60_KEYSTORE_PATH=$RUNNER_TEMP/move60-signing/move60.p12" >> "$GITHUB_ENV"
          echo "MOVE60_STORE_PASSWORD=$MOVE60_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MOVE60_KEY_PASSWORD=$MOVE60_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "MOVE60_KEY_ALIAS=$MOVE60_KEY_ALIAS" >> "$GITHUB_ENV"
          echo 'MOVE60_SIGNED=true' >> "$GITHUB_ENV"
      - name: Build Kotlin debug APK for compilation verification
        run: gradle --no-daemon --stacktrace :app:assembleDebug :wear:assembleDebug :wear:assembleDebugAndroidTest :app:assembleDebugAndroidTest
      - name: Upload Wear OS companion APK
        uses: actions/upload-artifact@v4
        with:
          name: MOVE60-WearOS-debug-APK
          path: wear/build/outputs/apk/debug/wear-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload debug verification APK
        uses: actions/upload-artifact@v4
        with:
          name: MOVE60-Kotlin-debug-test-only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Build stable signed release APK
        if: env.MOVE60_SIGNED == 'true'
        run: gradle --no-daemon --stacktrace :app:assembleRelease :wear:assembleRelease
      - name: Upload signed Galaxy Watch4 APK
        if: env.MOVE60_SIGNED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MOVE60-Galaxy-Watch4-signed-APK
          path: wear/build/outputs/apk/release/wear-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload stable signed release APK
        if: env.MOVE60_SIGNED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MOVE60-signed-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
  # Dedicated runner: the previous build ran WearOS and Pixel emulators back-to-back.
  # The second boot intermittently opened a Pixel Launcher ANR and blocked publication.
  # Keep both real device UI tests mandatory, but never share their emulator VM state.
  wear-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify release dependency policy
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 scripts/verify-release-gates.py
      - name: Verify unified phone and Wear OS design tokens
        run: python3 scripts/verify-design-tokens.py
      - name: Build Watch4 debug APK and instrumentation
        run: gradle --no-daemon :wear:assembleDebug :wear:assembleDebugAndroidTest
      - name: Enable KVM access for Wear OS emulator
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Gate release with small round Wear OS workout and ambient UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: android-wear
          profile: wearos_small_round
          avd-name: move60_wear_gate
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 3072
          disable-animations: true
          script: bash scripts/smoke-watch-layout.sh
      - name: Upload Wear OS runtime validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MOVE60-wear-release-gate-evidence
          path: smoke-debug/
          if-no-files-found: ignore
          retention-days: 14
  publish:
    needs: [build, runtime-smoke, wear-gate]
    if: needs.build.result == 'success' && needs.runtime-smoke.result == 'success' && needs.wear-gate.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MOVE60-signed-release-APK
          path: app/build/outputs/apk/release
      - uses: actions/download-artifact@v4
        with:
          name: MOVE60-Galaxy-Watch4-signed-APK
          path: wear/build/outputs/apk/release
      - name: Publish the signed APK to public update repository
        env:
          MOVE60_UPDATES_PAT: ${{ secrets.MOVE60_UPDATES_PAT }}
        shell: bash
        run: |
          # Guard against older runs publishing an APK after a newer commit.
          CURRENT_MAIN="$(git -C "$GITHUB_WORKSPACE" ls-remote origin refs/heads/main | cut -f1)"
          if [ "$CURRENT_MAIN" != "$GITHUB_SHA" ]; then
            echo "Skipping outdated build $GITHUB_SHA; main is $CURRENT_MAIN"
            exit 0
          fi
          if [ -z "$MOVE60_UPDATES_PAT" ]; then
            echo '::error::MOVE60_UPDATES_PAT is unavailable in MOVE60-Android Actions secrets.'
            exit 1
          fi
          git -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$MOVE60_UPDATES_PAT" | base64 -w0)" \
            clone --quiet https://github.com/yebyn98/MOVE60-Updates.git "$RUNNER_TEMP/move60-updates"
          cd "$RUNNER_TEMP/move60-updates"
          python3 "$GITHUB_WORKSPACE/scripts/publish_selected.py" \
            --updates "$PWD" \
            --workspace "$GITHUB_WORKSPACE" \
            --targets "$GITHUB_WORKSPACE/scripts/release-targets.json"
          git config user.name 'MOVE60 CI'
          git config user.email 'move60-ci@users.noreply.github.com'
          git add MOVE60-latest.apk MOVE60-Watch4-latest.apk latest.json
          if ! git diff --cached --quiet; then
            git commit -qm "Publish MOVE60 version $(python3 -c 'import json;print(json.load(open("latest.json"))["versionName"])')"
            git -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$MOVE60_UPDATES_PAT" | base64 -w0)" push -q origin HEAD:main
          fi


