plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
  id 'com.google.devtools.ksp'
  id 'com.google.dagger.hilt.android'
}
android {
  namespace 'com.move60.workout'
  compileSdk 35
  defaultConfig {
    applicationId 'com.move60.workout'
    minSdk 26
    targetSdk 35
    versionCode 47
    versionName '47.0'
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  }
  signingConfigs {
    stable {
      if (System.getenv('MOVE60_KEYSTORE_PATH')) {
        storeFile file(System.getenv('MOVE60_KEYSTORE_PATH'))
        storeType 'PKCS12'
        storePassword System.getenv('MOVE60_STORE_PASSWORD')
        keyAlias System.getenv('MOVE60_KEY_ALIAS')
        keyPassword System.getenv('MOVE60_KEY_PASSWORD')
      }
    }
  }
  buildTypes {
    release {
      if (System.getenv('MOVE60_KEYSTORE_PATH')) signingConfig signingConfigs.stable
      minifyEnabled false
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = '17' }
  buildFeatures { compose true }
}

dependencies {
    // Keep versions compatible with the existing compileSdk 35 and AGP 8.7.3.
    // Compose 1.12 / BOM 2026.09 requires API 37 + AGP 9; upgrade separately.
    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.compose.material:material-icons-extended'
    // Compatible with existing compileSdk 35; newer Health Connect clients require SDK36/AGP8.9.
    implementation 'androidx.health.connect:connect-client:1.1.0-alpha12'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
    implementation 'com.google.dagger:hilt-android:2.52'
    ksp 'com.google.dagger:hilt-compiler:2.52'
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
    implementation 'androidx.hilt:hilt-work:1.2.0'
    ksp 'androidx.hilt:hilt-compiler:1.2.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    implementation 'com.google.android.gms:play-services-wearable:19.0.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}


