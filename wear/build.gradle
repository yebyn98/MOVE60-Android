plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose' }
android {
    namespace 'com.move60.watch'
    compileSdk 35
    defaultConfig {
        applicationId 'com.move60.workout'
        minSdk 30
        targetSdk 35
        versionCode 49
        versionName '49.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
  signingConfigs {
    stable {
      if (System.getenv('MOVE60_KEYSTORE_PATH')) {
        storeFile file(System.getenv('MOVE60_KEYSTORE_PATH'))
        storeType 'PKCS12'
        storePassword System.getenv('MOVE60_STORE_PASSWORD')
        keyAlias System.getenv('MOVE60_KEY_ALIAS')
        keyPassword System.getenv('MOVE60_KEY_PASSWORD')
      }
    }
  }
  buildTypes {
    release {
      if (System.getenv('MOVE60_KEYSTORE_PATH')) signingConfig signingConfigs.stable
      minifyEnabled false
    }
  }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
}
dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.wear.compose:compose-material:1.4.1'
    implementation 'androidx.wear.compose:compose-foundation:1.4.1'
    implementation 'com.google.android.horologist:horologist-compose-layout:0.6.23'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    implementation 'androidx.activity:activity:1.9.3'
    // Activity Result APIs require Fragment >=1.3; make the runtime contract explicit.
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'androidx.wear:wear-ongoing:1.0.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    implementation 'com.google.android.gms:play-services-wearable:19.0.0'
    implementation 'androidx.health:health-services-client:1.1.0'
    implementation 'androidx.wear.tiles:tiles:1.6.2'
    implementation 'androidx.wear.protolayout:protolayout:1.4.2'
    implementation 'com.google.guava:guava:33.4.8-android'
}


